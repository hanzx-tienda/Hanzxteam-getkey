<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050709">
<title>HANZX TEAM • Generador de Keys</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark} body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background-color:#050709;background-image:linear-gradient(rgba(0,238,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,238,255,.035) 1px,transparent 1px);background-size:56px 56px;color:#f4f7fb;font-family:'Courier New',monospace}.app{width:min(100%,656px)}header{text-align:center;margin-bottom:24px}h1{margin:0;font-family:Arial,sans-serif;font-weight:900;font-size:clamp(28px,6vw,38px);letter-spacing:6px}h1 span{color:#00e9f5}.subtitle{margin:14px 0 0;color:#444b5d;font-size:12px;letter-spacing:4px}.panel{padding:28px;border-radius:13px;border:1px solid #1a1c25;background:rgba(13,14,19,.97);box-shadow:0 15px 50px #0005}.info{border:1px solid #ffffff0b;background:#ffffff03;border-radius:8px;padding:13px 14px;margin-bottom:10px}.info .label{display:block;color:#51596c;font-size:10px;letter-spacing:2px;margin-bottom:7px}.info .value{font-size:14px;font-weight:bold;color:#f4f7fb}.key-label{color:#51596c;font-size:11px;font-weight:bold;letter-spacing:4px;margin:22px 0 18px}.key{width:100%;min-height:84px;display:grid;place-items:center;padding:16px 10px;margin-bottom:28px;border:1px solid #00e9f5;border-radius:10px;background:#020405;color:#00e9f5;font-size:clamp(16px,4.5vw,22px);letter-spacing:2px;text-align:center;overflow-wrap:anywhere;box-shadow:0 0 24px #00e9f50f}.dots span{display:inline-block;animation:bounce .8s infinite ease-in-out;color:#001015}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}button{width:100%;min-height:68px;margin-top:28px;border:0;border-radius:10px;cursor:pointer;background:#00dff0;color:#001015;font:900 17px 'Courier New',monospace;letter-spacing:4px;transition:filter .15s,transform .15s}button:active{transform:scale(.99)}button:hover{filter:brightness(1.08)}button:disabled{opacity:.7;cursor:wait}
.aviso-box{display:none; margin:0 0 28px; padding:18px 14px; border-radius:14px; border:2px solid #00e9f5; background:#0a0d11; text-align:center; animation:avisoIn .5s ease-out, pulseBorder 1.8s infinite; box-shadow:0 0 0 0 #00e9f555, 0 0 25px #00e9f522;}
.aviso-box.show{display:block}
.aviso-icon{font-size:22px; color:#00e9f5; margin-bottom:6px; animation:iconFloat 1.5s ease-in-out infinite;}
.aviso-title{color:#00e9f5; font-weight:900; font-size:18px; letter-spacing:1px; margin:0 0 8px; text-shadow:0 0 10px #00e9f588;}
.aviso-text{color:#ffffff; font-weight:900; font-size:15px; letter-spacing:0px; line-height:1.3; font-family:Arial,sans-serif;}
@keyframes avisoIn{0%{transform:scale(.85) translateY(10px); opacity:0}100%{transform:scale(1) translateY(0); opacity:1}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 #00e9f555, 0 0 15px #00e9f522; border-color:#00e9f5}50%{box-shadow:0 0 0 8px #00e9f500, 0 0 30px #00e9f555; border-color:#4af2ff}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(max-width:420px){.panel{padding:20px 16px}.subtitle{letter-spacing:2px}.key-label{letter-spacing:3px}}
</style></head>
<body><main class="app"><header><h1>HANZX <span>TEAM</span></h1><p class="subtitle">FREE KEY — 365 DAYS</p></header><section class="panel"><div class="info"><span class="label">KEY CREADA POR</span><div class="value">SENSI HANZX</div></div><div class="info"><span class="label">TIPO DE KEY</span><div class="value">FREE / GRATIS</div></div><div class="info"><span class="label">DURACIÓN</span><div class="value">365 DAYS</div></div><div class="key-label">YOUR KEY</div><div class="key" id="key">TU KEY ESTÁ PROTEGIDA</div>

<div class="aviso-box" id="aviso">
<div class="aviso-icon">🛡️</div>
<div class="aviso-title">¡AVISO DE SEGURIDAD!</div>
<div class="aviso-text">NO COMPARTAS TU KEY CON NADIEN.</div>
</div>

<button id="action" type="button">GENERAR KEY</button></section></main>
<script>
const KEY='PLAYPING', action=document.getElementById('action'), keyBox=document.getElementById('key'), aviso=document.getElementById('aviso');let generated=false;
action.addEventListener('click',async()=>{
if(!generated){
action.disabled=true;
action.innerHTML='GENERANDO KEY<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
keyBox.textContent='TU KEY ESTÁ PROTEGIDA';
aviso.classList.remove('show');
await new Promise(r=>setTimeout(r,1800));
keyBox.textContent=KEY;
aviso.classList.add('show');
action.disabled=false;
action.textContent='COPIAR KEY';
generated=true;
return
}
try{
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(KEY)}else{const t=document.createElement('textarea');t.value=KEY;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();t.setSelectionRange(0,t.value.length);const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy failed')}
action.textContent='✓ KEY COPIADA';
setTimeout(()=>action.textContent='COPIAR KEY',1800)
}catch(e){
action.textContent='COPIAR KEY';
alert('MANTÉN PULSADA PLAYPING PARA COPIAR');
}
});
</script></body></html>
